<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('상품 관리')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar}" th:with="pageTitle='상품 관리'"></div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="content-card">
        <div class="d-flex justify-content-between mb-3">
            <form class="d-flex gap-2" method="get">
                <input type="text" name="keyword" class="form-control form-control-sm" placeholder="상품명 검색" th:value="${keyword}" style="width:200px">
                <select name="status" class="form-select form-select-sm" style="width:130px">
                    <option value="">전체 상태</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option>
                </select>
                <button class="btn btn-sm btn-outline-primary">검색</button>
            </form>
            <a href="/admin/products/new" class="btn btn-sm btn-primary">+ 상품 등록</a>
        </div>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th style="width:60px">ID</th>
                    <th>상품명</th>
                    <th>카테고리</th>
                    <th class="text-end">판매가</th>
                    <th class="text-end">할인가</th>
                    <th class="text-center">상태</th>
                    <th class="text-center">등록일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}" style="cursor:pointer" th:onclick="'location.href=\'/admin/products/' + ${p.id} + '\''">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.category?.name ?: '-'}"></td>
                    <td class="text-end" th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'"></td>
                    <td class="text-end" th:text="${p.salePrice != null ? #numbers.formatInteger(p.salePrice, 0, 'COMMA') + '원' : '-'}"></td>
                    <td class="text-center">
                        <span class="badge" th:text="${p.status.label}"
                              th:classappend="${p.status.name() == 'ON_SALE' ? 'bg-success' : (p.status.name() == 'SOLD_OUT' ? 'bg-danger' : 'bg-secondary')}"></span>
                    </td>
                    <td class="text-center" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}"></td>
                </tr>
                <tr th:if="${products.totalElements == 0}">
                    <td colspan="7" class="text-center text-muted py-4">등록된 상품이 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 -->
        <nav th:if="${products.totalPages > 1}">
            <ul class="pagination pagination-sm justify-content-center">
                <li class="page-item" th:classappend="${products.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${products.number - 1}, keyword=${keyword}, status=${status})}">이전</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${i == products.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword}, status=${status})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${products.last ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${products.number + 1}, keyword=${keyword}, status=${status})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
