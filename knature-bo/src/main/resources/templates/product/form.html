<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('상품 등록/수정')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar}" th:with="pageTitle=${product.id != null ? '상품 수정' : '상품 등록'}"></div>

    <div class="content-card">
        <form method="post" action="/admin/products/save">
            <input type="hidden" name="id" th:value="${product.id}">

            <div class="row mb-3">
                <div class="col-md-8">
                    <label class="form-label fw-bold">상품명 *</label>
                    <input type="text" name="name" class="form-control" th:value="${product.name}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">상품코드</label>
                    <input type="text" name="code" class="form-control" th:value="${product.code}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">카테고리</label>
                    <select name="categoryId" class="form-select">
                        <option value="">선택</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category?.id == c.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">판매가 *</label>
                    <input type="number" name="price" class="form-control" th:value="${product.price}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">할인가</label>
                    <input type="number" name="salePrice" class="form-control" th:value="${product.salePrice}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">상품 설명</label>
                <textarea name="description" class="form-control" rows="3" th:text="${product.description}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">상세 내용</label>
                <textarea name="detailContent" class="form-control" rows="8" th:text="${product.detailContent}"></textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">판매 상태</label>
                    <select name="status" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${product.status == s}"></option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">저장</button>
                <a href="/admin/products" class="btn btn-outline-secondary">취소</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
