<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNATURE Admin - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #2c3e50; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Malgun Gothic', sans-serif; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
        .login-box h2 { text-align: center; margin-bottom: 30px; font-weight: bold; color: #2c3e50; }
        .login-box .sub { text-align: center; color: #7f8c8d; font-size: 0.85rem; margin-top: -20px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>KNATURE</h2>
        <p class="sub">관리자 로그인</p>
        <div th:if="${param.error}" class="alert alert-danger py-2">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div th:if="${param.logout}" class="alert alert-info py-2">로그아웃 되었습니다.</div>
        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label class="form-label">아이디</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>
    </div>
</body>
</html>
