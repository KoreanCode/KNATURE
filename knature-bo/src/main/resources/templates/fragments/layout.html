<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- HEAD -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - KNATURE Admin'">KNATURE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6f9; }
        .sidebar { width: 250px; min-height: 100vh; background: #2c3e50; position: fixed; top: 0; left: 0; z-index: 100; }
        .sidebar .logo { padding: 20px; color: #fff; font-size: 1.3rem; font-weight: bold; border-bottom: 1px solid #34495e; }
        .sidebar .nav-link { color: #bdc3c7; padding: 12px 20px; border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #34495e; border-left-color: #3498db; }
        .sidebar .nav-link i { width: 24px; margin-right: 8px; }
        .main-content { margin-left: 250px; padding: 20px; }
        .top-bar { background: #fff; padding: 12px 20px; margin: -20px -20px 20px; box-shadow: 0 2px 4px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; }
        .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.06); }
        .stat-card .number { font-size: 1.8rem; font-weight: bold; }
        .stat-card .label { color: #7f8c8d; font-size: 0.85rem; }
        .content-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.06); margin-bottom: 20px; }
    </style>
</head>

<!-- SIDEBAR -->
<nav th:fragment="sidebar" class="sidebar">
    <div class="logo">KNATURE Admin</div>
    <ul class="nav flex-column mt-2">
        <li class="nav-item">
            <a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2"></i>대시보드</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/admin/orders"><i class="bi bi-cart-check"></i>주문 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/admin/products"><i class="bi bi-box-seam"></i>상품 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/admin/members"><i class="bi bi-people"></i>고객 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/admin/inventory"><i class="bi bi-clipboard-data"></i>재고 관리</a>
        </li>
        <li class="nav-item mt-3" style="border-top:1px solid #34495e; padding-top:8px;">
            <a class="nav-link" href="/admin/settings"><i class="bi bi-gear"></i>설정</a>
        </li>
    </ul>
</nav>

<!-- TOPBAR -->
<div th:fragment="topbar" class="top-bar">
    <h5 class="mb-0" th:text="${pageTitle}">페이지</h5>
    <div>
        <span class="me-3" th:text="${#authentication.name} + '님'">관리자님</span>
        <a href="/logout" class="btn btn-outline-secondary btn-sm">로그아웃</a>
    </div>
</div>

<!-- SCRIPTS -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
