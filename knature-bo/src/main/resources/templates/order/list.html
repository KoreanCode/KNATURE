<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('주문 관리')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar}" th:with="pageTitle='주문 관리'"></div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="content-card">
        <form class="d-flex gap-2 mb-3" method="get">
            <input type="text" name="keyword" class="form-control form-control-sm" placeholder="주문번호/주문자명 검색" th:value="${keyword}" style="width:220px">
            <select name="status" class="form-select form-select-sm" style="width:140px">
                <option value="">전체 상태</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option>
            </select>
            <button class="btn btn-sm btn-outline-primary">검색</button>
        </form>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th style="width:60px">ID</th>
                    <th>주문번호</th>
                    <th>주문자</th>
                    <th class="text-end">결제금액</th>
                    <th class="text-center">결제수단</th>
                    <th class="text-center">상태</th>
                    <th class="text-center">주문일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="o : ${orders}" style="cursor:pointer" th:onclick="'location.href=\'/admin/orders/' + ${o.id} + '\''">
                    <td th:text="${o.id}"></td>
                    <td th:text="${o.orderNumber}"></td>
                    <td th:text="${o.ordererName}"></td>
                    <td class="text-end" th:text="${#numbers.formatInteger(o.paymentAmount, 0, 'COMMA')} + '원'"></td>
                    <td class="text-center" th:text="${o.paymentMethod.label}"></td>
                    <td class="text-center"><span class="badge bg-info" th:text="${o.status.label}"></span></td>
                    <td class="text-center" th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd')}"></td>
                </tr>
                <tr th:if="${orders.totalElements == 0}">
                    <td colspan="7" class="text-center text-muted py-4">주문 내역이 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${orders.totalPages > 1}">
            <ul class="pagination pagination-sm justify-content-center">
                <li class="page-item" th:classappend="${orders.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1}, keyword=${keyword}, status=${status})}">이전</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}" th:classappend="${i == orders.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/admin/orders(page=${i}, keyword=${keyword}, status=${status})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${orders.last ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1}, keyword=${keyword}, status=${status})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
