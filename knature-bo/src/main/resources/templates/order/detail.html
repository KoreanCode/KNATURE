<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('주문 상세')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar}" th:with="pageTitle='주문 상세'"></div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="content-card">
                <h6 class="mb-3">주문 정보</h6>
                <table class="table table-sm">
                    <tr><th style="width:120px">주문번호</th><td th:text="${order.orderNumber}"></td></tr>
                    <tr><th>주문자</th><td th:text="${order.ordererName} + ' / ' + ${order.ordererPhone}"></td></tr>
                    <tr><th>수령인</th><td th:text="${order.receiverName} + ' / ' + ${order.receiverPhone}"></td></tr>
                    <tr><th>배송지</th><td th:text="'(' + ${order.receiverZipcode} + ') ' + ${order.receiverAddress} + ' ' + ${order.receiverAddressDetail}"></td></tr>
                    <tr><th>배송메모</th><td th:text="${order.deliveryMemo ?: '-'}"></td></tr>
                    <tr><th>결제수단</th><td th:text="${order.paymentMethod.label}"></td></tr>
                    <tr><th>상품금액</th><td th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'"></td></tr>
                    <tr><th>배송비</th><td th:text="${#numbers.formatInteger(order.deliveryFee, 0, 'COMMA')} + '원'"></td></tr>
                    <tr><th>결제금액</th><td class="fw-bold" th:text="${#numbers.formatInteger(order.paymentAmount, 0, 'COMMA')} + '원'"></td></tr>
                    <tr><th>주문일시</th><td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
                </table>
            </div>

            <div class="content-card">
                <h6 class="mb-3">주문 상품</h6>
                <table class="table table-sm">
                    <thead class="table-light">
                        <tr><th>상품명</th><th>옵션</th><th class="text-center">수량</th><th class="text-end">금액</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.productName}"></td>
                            <td th:text="${item.optionName ?: '-'}"></td>
                            <td class="text-center" th:text="${item.quantity}"></td>
                            <td class="text-end" th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')} + '원'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-4">
            <div class="content-card">
                <h6 class="mb-3">상태 변경</h6>
                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                    <select name="status" class="form-select mb-2">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == order.status}"></option>
                    </select>
                    <button class="btn btn-primary btn-sm w-100">상태 변경</button>
                </form>
            </div>

            <div class="content-card">
                <h6 class="mb-3">관리자 메모</h6>
                <form th:action="@{/admin/orders/{id}/memo(id=${order.id})}" method="post">
                    <textarea name="memo" class="form-control mb-2" rows="4" th:text="${order.adminMemo}"></textarea>
                    <button class="btn btn-outline-primary btn-sm w-100">메모 저장</button>
                </form>
            </div>
        </div>
    </div>

    <a href="/admin/orders" class="btn btn-outline-secondary btn-sm mt-2">목록으로</a>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
