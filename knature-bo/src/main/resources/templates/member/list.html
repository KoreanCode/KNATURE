<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('고객 관리')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar}" th:with="pageTitle='고객 관리'"></div>

    <div class="content-card">
        <form class="d-flex gap-2 mb-3" method="get">
            <input type="text" name="keyword" class="form-control form-control-sm" placeholder="이름/아이디 검색" th:value="${keyword}" style="width:200px">
            <select name="grade" class="form-select form-select-sm" style="width:140px">
                <option value="">전체 등급</option>
                <option th:each="g : ${grades}" th:value="${g}" th:text="${g.label}" th:selected="${g == grade}"></option>
            </select>
            <button class="btn btn-sm btn-outline-primary">검색</button>
        </form>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th style="width:60px">ID</th>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th class="text-center">등급</th>
                    <th class="text-end">총 구매금액</th>
                    <th class="text-center">가입일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${members}" style="cursor:pointer" th:onclick="'location.href=\'/admin/members/' + ${m.id} + '\''">
                    <td th:text="${m.id}"></td>
                    <td th:text="${m.username}"></td>
                    <td th:text="${m.name}"></td>
                    <td th:text="${m.email}"></td>
                    <td class="text-center"><span class="badge bg-primary" th:text="${m.grade.label}"></span></td>
                    <td class="text-end" th:text="${#numbers.formatInteger(m.totalPurchaseAmount, 0, 'COMMA')} + '원'"></td>
                    <td class="text-center" th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd')}"></td>
                </tr>
                <tr th:if="${members.totalElements == 0}">
                    <td colspan="7" class="text-center text-muted py-4">등록된 회원이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
