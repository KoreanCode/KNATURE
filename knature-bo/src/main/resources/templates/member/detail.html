<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('회원 상세')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar}" th:with="pageTitle='회원 상세'"></div>

    <div class="content-card">
        <h6 class="mb-3" th:text="${member.name} + ' 회원 정보'"></h6>
        <table class="table">
            <tr><th style="width:150px">ID</th><td th:text="${member.id}"></td></tr>
            <tr><th>아이디</th><td th:text="${member.username}"></td></tr>
            <tr><th>이름</th><td th:text="${member.name}"></td></tr>
            <tr><th>이메일</th><td th:text="${member.email}"></td></tr>
            <tr><th>전화번호</th><td th:text="${member.phone ?: '-'}"></td></tr>
            <tr><th>주소</th><td th:text="${member.address != null ? '(' + member.zipcode + ') ' + member.address + ' ' + member.addressDetail : '-'}"></td></tr>
            <tr><th>등급</th><td><span class="badge bg-primary" th:text="${member.grade.label}"></span></td></tr>
            <tr><th>총 구매금액</th><td th:text="${#numbers.formatInteger(member.totalPurchaseAmount, 0, 'COMMA')} + '원'"></td></tr>
            <tr><th>가입일</th><td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}"></td></tr>
        </table>
        <a href="/admin/members" class="btn btn-outline-secondary btn-sm">목록으로</a>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
